name: Bug Report
description: Create a report to help us reproduce and fix the bug
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe the issue...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Run 'vsub sample.mp4 -t ja'
        2. See error...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error Output / Logs
      description: Paste relevant command output or error messages here.
      render: shell
  - type: input
    id: environment
    attributes:
      label: Environment Info
      description: OS, Node.js version, and FFmpeg version.
      placeholder: "e.g., Ubuntu 24.04 / macOS 15 / Windows 11, Node.js 26.x, FFmpeg 7.x"
    validations:
      required: true
