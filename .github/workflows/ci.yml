name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Run Biome check
        run: pnpm check

  test:
    name: Test on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['24', '26']
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup environment (with FFmpeg)
        uses: ./.github/actions/setup-env
        with:
          node-version: ${{ matrix.node-version }}
          with-ffmpeg: 'true'

      - name: Verify FFmpeg availability
        run: ffmpeg -version

      - name: Run tests with coverage
        run: pnpm test:coverage

  build:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run build (TypeScript)
        run: pnpm build

  verify-binaries:
    name: Verify Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: vsub-windows-x64.exe
          - os: windows-11-arm
            target: vsub-windows-arm64.exe
          - os: ubuntu-latest
            target: vsub-linux-x64
          - os: ubuntu-24.04-arm
            target: vsub-linux-arm64
          - os: macos-latest
            target: vsub-macos-arm64
          - os: macos-15-intel
            target: vsub-macos-x64
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Build and verify standalone binary
        run: pnpm build:binary --name ${{ matrix.target }}

