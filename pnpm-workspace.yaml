allowBuilds:
  '@biomejs/biome': true
  '@google/genai': true
  esbuild: true
  protobufjs: true
minimumReleaseAge: 4320
update:
  # Intentionally disabled because minimumReleaseAge cooldown does not apply to GitHub Actions,
  # preventing immediate ingestion of compromised or malicious action updates.
  # Workflow action updates are managed via Dependabot PRs after reviewing release notes and diffs.
  githubActions: false

